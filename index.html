<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <title>الاستعلام عن الرواتب - مديرية غاز الجنوب</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base target="_top">
    
    <style>
        /* تنسيق حاوية التحميل */
        #loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff; /* لون خلفية الصفحة أثناء التحميل */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* تصميم الدائرة المتحركة الاحترافي */
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db; /* لون الدائرة المتحرك */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* إخفاء السكرول بار أثناء التحميل وتثبيت الارتفاع */
        body { margin: 0; overflow: hidden; height: 100vh; }
    </style>
</head>
<body>

    <div id="loader-container">
        <div class="loader"></div>
    </div>

    <iframe id="myIframe" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; z-index: 1;" 
        src="https://script.google.com/macros/s/AKfycbzbT3OFCIRljutgpP0XhATpOqW3cKKAtFzWPDPE18vS91bjsdzBrFH59BGNUNBwIUmHpA/exec">
    </iframe>

    <div style="position: fixed; bottom: 0; left: 0; right: 0; z-index: 100000; direction: ltr;">
        <input autocomplete="off" type="checkbox" id="aadsstickymp8aobja" hidden />
        <div style="padding-top: 0; padding-bottom: 50px;">
            <div style="width:320px;height:50px;position:fixed;text-align:center;font-size:0;bottom:0;left:0;right:0;margin:auto">
                <label for="aadsstickymp8aobja" style="top: -24px; right: 0; position: absolute; border-radius: 4px; background: rgba(248, 248, 249, 0.70); padding: 4px; z-index: 100001; cursor:pointer">
                    <svg fill="#000000" height="16px" width="16px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 490">
                        <polygon points="456.851,0 245,212.564 33.149,0 0.708,32.337 212.669,245.004 0.708,457.678 33.149,490 245,277.443 456.851,490 489.292,457.678 277.331,245.004 489.292,32.337 "/>
                    </svg>
                </label>
                <div id="frame" style="width: 320px; margin: auto; z-index: 99999; height: auto">
                    <iframe data-aa="2437824" src="//ad.a-ads.com/2437824/?size=320x50" style="border:0; padding:0; width:320px; height:50px; overflow:hidden; margin: auto"></iframe>
                </div>
            </div>
            <style>
                #aadsstickymp8aobja:checked + div {
                    display: none;
                }
            </style>
        </div>
    </div>
    <script>
        // وظيفة لإخفاء دائرة التحميل عند اكتمال تحميل الـ iframe
        var iframe = document.getElementById('myIframe');
        var loader = document.getElementById('loader-container');

        iframe.onload = function() {
            // إضافة تأثير اختفاء تدريجي بسيط
            loader.style.transition = "opacity 0.5s ease";
            loader.style.opacity = "0";
            setTimeout(function() {
                loader.style.display = "none";
            }, 500);
        };
    </script>

</body>
</html>

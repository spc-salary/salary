<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <title>الاستعلام عن الرواتب - قسم غاز الجنوب</title>
  <meta name="theme-color" content="c8dbe9">
  <link rel="manifest" href="/salary/manifest.json">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; overflow: hidden; }
    body { background: #071421; color: #e8f0f2; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }
    button { font: inherit; }

    .salary-app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100%;
      overflow: hidden;
      background: #071421;
      direction: rtl;
    }

    .site-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f7f8;
    }

    .loader-container {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 50% 43%, rgba(34, 108, 126, .20), transparent 42%),
        linear-gradient(145deg, #071523 0%, #0a1e30 54%, #0a2536 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity .72s cubic-bezier(.2,.7,.25,1), visibility 0s linear 0s;
    }

    .loader-container::before {
      position: absolute;
      inset: 0;
      content: "";
      opacity: .28;
      pointer-events: none;
      background-image: radial-gradient(rgba(183, 219, 223, .2) .65px, transparent .65px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, transparent, #000 20%, #000 77%, transparent);
    }

    .loader-container::after {
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(161, 196, 203, .12);
      border-radius: 18px;
      content: "";
      pointer-events: none;
    }

    .loader-container.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .72s cubic-bezier(.2,.7,.25,1), visibility 0s linear .72s;
    }

    .industrial-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .76;
      pointer-events: none;
    }

    .scene-grid {
      position: absolute;
      inset: auto 0 0;
      height: 39%;
      opacity: .15;
      background-image:
        linear-gradient(rgba(118, 175, 190, .22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(118, 175, 190, .22) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(to top, #000, transparent);
      transform: perspective(340px) rotateX(48deg) scale(1.4);
      transform-origin: bottom;
    }

    .scene-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 25%, rgba(3, 12, 21, .56) 100%);
    }

    .loader-content {
      position: relative;
      z-index: 2;
      display: flex;
      width: min(100%, 510px);
      flex-direction: column;
      align-items: center;
      text-align: center;
      transform: translateY(-3px);
    }

    .identity-line {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 23px;
      color: rgba(214, 227, 231, .72);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      animation: rise-in .65s .05s both;
    }

    .identity-line::before,
    .identity-line::after {
      width: 25px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(140, 194, 201, .65));
      content: "";
    }

    .identity-line::after { transform: rotate(180deg); }
    .identity-line b { color: #75c3bd; font: 700 10px sans-serif; letter-spacing: .08em; }

    .emblem {
      position: relative;
      display: grid;
      width: 112px;
      height: 112px;
      place-items: center;
      margin-bottom: 24px;
      border: 1px solid rgba(175, 211, 218, .42);
      border-radius: 50%;
      background: linear-gradient(150deg, rgba(193, 224, 226, .13), rgba(17, 45, 61, .36));
      box-shadow: inset 0 0 32px rgba(171, 213, 214, .08), 0 14px 52px rgba(0, 0, 0, .22);
      animation: emblem-in .85s .12s both;
    }

    .emblem::before,
    .emblem::after {
      position: absolute;
      inset: -9px;
      border: 1px solid rgba(108, 188, 185, .22);
      border-radius: 50%;
      content: "";
      animation: orbit-in 1s .25s both;
    }

    .emblem::after { inset: -17px; border-color: rgba(174, 201, 211, .12); }

    .logo-img {
      display: block;
      width: 66px;
      height: 66px;
      object-fit: contain;
      filter: drop-shadow(0 4px 15px rgba(186, 221, 222, .35));
    }

    .emblem-mark {
      position: absolute;
      right: 4px;
      bottom: 12px;
      width: 8px;
      height: 8px;
      border: 1px solid #071421;
      border-radius: 50%;
      background: #72c9be;
      box-shadow: 0 0 12px rgba(114, 201, 190, .55);
    }

    .main-title {
      margin: 0;
      color: #eff6f6;
      font-size: clamp(23px, 5.5vw, 35px);
      font-weight: 900;
      letter-spacing: -.035em;
      line-height: 1.45;
      text-shadow: 0 5px 24px rgba(0, 0, 0, .25);
      animation: rise-in .68s .29s both;
    }

    .sub-title {
      margin-top: 5px;
      color: #8acdc4;
      font-size: clamp(16px, 4vw, 20px);
      font-weight: 700;
      animation: rise-in .68s .37s both;
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 21px 0 25px;
      animation: rise-in .68s .44s both;
    }

    .ornament-line {
      width: 59px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(127, 189, 192, .55));
    }

    .ornament-line:last-child { transform: rotate(180deg); }
    .ornament-node { width: 5px; height: 5px; border: 1px solid #88c9c3; transform: rotate(45deg); }

    .progress-wrapper {
      width: min(330px, 82vw);
      animation: rise-in .68s .5s both;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      color: #a5b8be;
      font-size: 11px;
      font-weight: 600;
    }

    .progress-track {
      position: relative;
      height: 4px;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(211, 231, 233, .14);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #76c9be, #c1d5d6);
      box-shadow: 0 0 12px rgba(113, 201, 191, .38);
      transition: width .3s ease;
    }

    .status-text {
      min-height: 23px;
      margin: 13px 0 0;
      color: rgba(197, 214, 217, .74);
      font-size: 11px;
      font-weight: 500;
    }

    .continue-button {
      margin-top: 10px;
      padding: 7px 14px;
      border: 1px solid rgba(154, 200, 201, .33);
      border-radius: 999px;
      background: rgba(184, 221, 220, .07);
      color: #d4e7e6;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .continue-button:hover {
      transform: translateY(-1px);
      border-color: rgba(154, 220, 212, .7);
      background: rgba(184, 221, 220, .13);
    }

    .continue-button:focus-visible { outline: 2px solid #8ad1c7; outline-offset: 3px; }

    .footer-badge {
      position: absolute;
      z-index: 2;
      bottom: max(30px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(170, 193, 198, .57);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      animation: rise-in .7s .58s both;
    }

    .footer-rule { width: 20px; height: 1px; background: rgba(140, 185, 190, .38); }
    .footer-badge strong { color: rgba(181, 206, 207, .74); font: 600 9px sans-serif; letter-spacing: .13em; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes emblem-in {
      from { opacity: 0; transform: scale(.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes orbit-in {
      from { opacity: 0; transform: scale(.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-height: 650px) {
      .loader-content { transform: scale(.83); }
      .footer-badge { bottom: max(13px, env(safe-area-inset-bottom)); }
    }

    @media (max-width: 480px) {
      .loader-container { padding-inline: 22px; }
      .loader-container::after { inset: 10px; border-radius: 14px; }
      .emblem { width: 96px; height: 96px; margin-bottom: 20px; }
      .logo-img { width: 58px; height: 58px; }
      .ornament { margin: 17px 0 21px; }
      .footer-badge { gap: 8px; font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="salary-app" dir="rtl" lang="ar">
    <iframe
      id="myIframe"
      class="site-frame"
      title="نظام الاستعلام عن الرواتب - قسم غاز الجنوب"
      src="https://script.google.com/macros/s/AKfycbzbT3OFCIRljutgpP0XhATpOqW3cKKAtFzWPDPE18vS91bjsdzBrFH59BGNUNBwIUmHpA/exec"
    ></iframe>

    <section
      id="loader-container"
      class="loader-container"
      aria-hidden="false"
      aria-label="شاشة بدء نظام الاستعلام عن الرواتب"
    >
      <div class="industrial-scene" aria-hidden="true">
        <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
          <defs>
            <linearGradient id="pipeSteel" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#8ba7ae" stop-opacity=".05"></stop>
              <stop offset=".48" stop-color="#b6d0d3" stop-opacity=".2"></stop>
              <stop offset="1" stop-color="#5a8992" stop-opacity=".07"></stop>
            </linearGradient>
            <linearGradient id="pipeLight" x1="0" x2="1">
              <stop offset="0" stop-color="#6dc9c0" stop-opacity="0"></stop>
              <stop offset=".5" stop-color="#9de0d5" stop-opacity=".62"></stop>
              <stop offset="1" stop-color="#6dc9c0" stop-opacity="0"></stop>
            </linearGradient>
          </defs>
          <g fill="none" stroke="url(#pipeSteel)" stroke-width="18">
            <path d="M-70 276h255q64 0 64 64v80q0 58 58 58h180"></path>
            <path d="M1510 194h-228q-64 0-64 64v72q0 61-61 61h-113"></path>
            <path d="M-20 690h300q54 0 54-54v-32q0-54 54-54h150"></path>
            <path d="M1495 658h-274q-66 0-66-66v-47q0-50-50-50h-82"></path>
          </g>
          <g fill="none" stroke="url(#pipeLight)" stroke-width="2">
            <path d="M-70 276h255q64 0 64 64v80q0 58 58 58h180"></path>
            <path d="M1510 194h-228q-64 0-64 64v72q0 61-61 61h-113"></path>
            <path d="M-20 690h300q54 0 54-54v-32q0-54 54-54h150"></path>
            <path d="M1495 658h-274q-66 0-66-66v-47q0-50-50-50h-82"></path>
          </g>
          <g fill="none" stroke="#a9c1c7" stroke-opacity=".14" stroke-width="2">
            <path d="M198 266v20m18-20v20m1013-110v20m18-20v20M311 675v20m18-20v20m847-220v20m18-20v20"></path>
            <circle cx="492" cy="478" r="22"></circle>
            <circle cx="946" cy="392" r="22"></circle>
            <path d="M472 478h40m414-86h40M492 456v44m454-108v44"></path>
          </g>
        </svg>
      </div>
      <div class="scene-grid" aria-hidden="true"></div>
      <div class="scene-vignette" aria-hidden="true"></div>

      <div class="loader-content">
        <div class="identity-line">
          <span>السورية للبترول</span>
          <b dir="ltr">SPC</b>
        </div>

        <div class="emblem">
          <img
            class="logo-img"
            src="https://i.ibb.co/KxqP2H7R/70836-11zon.png"
            alt="شعار قسم غاز جنوب المنطقة الوسطى"
          >
          <span class="emblem-mark"></span>
        </div>

        <h1 class="main-title">قسم غاز جنوب المنطقة الوسطى</h1>
        <div class="sub-title">نظام الاستعلام عن الرواتب</div>

        <div class="ornament" aria-hidden="true">
          <span class="ornament-line"></span>
          <span class="ornament-node"></span>
          <span class="ornament-line"></span>
        </div>

        <div class="progress-wrapper">
          <div class="progress-labels">
            <span>جارٍ الاتصال</span>
            <span id="pct" dir="ltr">0%</span>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-label="تقدم تحميل نظام الرواتب"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="status-text" class="status-text" aria-live="polite">
            يرجى الانتظار، يتم الاتصال
          </p>
          <button
            id="continue-button"
            class="continue-button"
            type="button"
            onclick="hideLoader(false, false)"
          >متابعة</button>
        </div>
      </div>

      <div class="footer-badge">
        <span>نظام الرواتب الإلكتروني</span>
        <span class="footer-rule"></span>
        <strong dir="ltr">2026</strong>
      </div>
    </section>
  </main>

  <script>
    const pctEl = document.getElementById('pct');
    const statusEl = document.getElementById('status-text');
    const fillEl = document.getElementById('progress-fill');
    const loader = document.getElementById('loader-container');
    const iframe = document.getElementById('myIframe');
    const progressTrack = document.querySelector('.progress-track');
    const continueButton = document.getElementById('continue-button');
    const startedAt = Date.now();
    let loaderHidden = false;

    const progressTimer = window.setInterval(() => {
      if (loaderHidden) return;
      const progress = Math.min(92, Math.round(((Date.now() - startedAt) / 12000) * 92));
      pctEl.textContent = progress + '%';
      fillEl.style.width = progress + '%';
      progressTrack.setAttribute('aria-valuenow', String(progress));

      if (progress < 28) {
        statusEl.textContent = 'يرجى الانتظار، يتم الاتصال بالنظام';
      } else if (progress < 58) {
        statusEl.textContent = 'جارٍ التحقق من الاتصال…';
      } else {
        statusEl.textContent = 'يتم تحميل بيانات الرواتب…';
      }
    }, 160);

    function hideLoader(didLoad = true, wasTimeout = false) {
      if (loaderHidden) return;
      loaderHidden = true;
      window.clearInterval(progressTimer);
      window.clearTimeout(fallbackTimer);

      if (didLoad) {
        pctEl.textContent = '100%';
        fillEl.style.width = '100%';
        progressTrack.setAttribute('aria-valuenow', '100');
        statusEl.textContent = 'تم تحميل النظام، جارٍ الفتح…';
      } else if (wasTimeout) {
        statusEl.textContent = 'تعذّر تأكيد اكتمال التحميل. يمكنك متابعة الصفحة.';
      }

      loader.classList.add('is-hidden');
      loader.setAttribute('aria-hidden', 'true');
      window.setTimeout(() => {
        loader.style.display = 'none';
      }, 760);
    }

    iframe.addEventListener('load', () => hideLoader(true), { once: true });
    continueButton.addEventListener('click', () => hideLoader(false, false));

    const fallbackTimer = window.setTimeout(() => {
      pctEl.textContent = '92%';
      fillEl.style.width = '92%';
      progressTrack.setAttribute('aria-valuenow', '92');
      hideLoader(false, true);
    }, 12000);
  </script>
</body>
</html>
